<!DOCTYPE html>
<html>
<head>
    <title>Update Note</title>
</head>
<body>
    <h1>Update Your Note</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Note Title:</label>
        <br>
        <input
            type="text"
            name="title"
            value="{{ note.title }}"
            required
        >
        <br><br>
        <label>Note Content:</label>
        <br>
        <textarea
            name="content"
            rows="15"
            cols="60"
            required
        >{{ note.content }}</textarea>
        <br><br>
        <button type="submit">Save Changes</button>
    </form>
    <br>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</body>
</html>
