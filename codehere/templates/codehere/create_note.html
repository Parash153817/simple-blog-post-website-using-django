
<!DOCTYPE html>
<html>
<head>
    <title>Create Note</title>
</head>
<body>
    <h1>Create New Note</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Note Title:</label>
        <br>
        <input
            type="text"
            name="title"
            required
        >
        <br><br>
        <label>Note Content:</label>
        <br>
        <textarea
            name="content"
            rows="15"
            cols="60"
            required
        ></textarea>
        <br><br>
        <button type="submit">Save Note</button>
    </form>
    <br>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</body>
</html>
